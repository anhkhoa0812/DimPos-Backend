syntax="proto3";

option csharp_namespace = "DimPos.Payment.Application.Common.Protos";

service PaymentGrpcService {
  rpc CreateB2CPayment(CreateB2CPaymentRequest) returns (CreateB2CPaymentResponse);
  rpc GetSystemPaymentMethodById(GetSystemPaymentMethodByIdRequest) returns (GetSystemPaymentMethodByIdResponse);
  rpc CreatePaymentTransaction(CreatePaymentTransactionRequest) returns (CreatePaymentTransactionResponse);
  rpc GetSystemPaymentMethodListById(GetSystemPaymentMethodListByIdRequest) returns (GetSystemPaymentMethodListByIdResponse);
  rpc UpdatePaymentMethodForOrder (UpdatePaymentMethodForOrderRequest) returns (UpdatePaymentMethodForOrderResponse);
}
message CreateB2CPaymentRequest {
  string storeId = 1;
  optional string customerId = 2;
  string orderId = 3;
  PaymentMethod paymentMethod = 4;
  string amount = 5;
  string currencyCode = 6;
  optional string description = 7;
}
message GetSystemPaymentMethodListByIdRequest {
  repeated string systemPaymentMethodIds = 1;
}
message GetSystemPaymentMethodListByIdResponse {
  repeated GetSystemPaymentMethodByIdResponse systemPaymentMethods = 1;
}
enum PaymentMethod {
  CASH = 0;
  QR_VIETQR = 1;
  QR_EDC = 2;
  CARD_EDC = 3;
}
message CreateB2CPaymentResponse {
  bool isSuccess = 1;
  string message = 2;
  optional string paymentUrl = 3;
}
message CreatePaymentTransactionResponse {
  string qrLink = 1;
  string systemPaymentMethodName = 2;
}
message CreatePaymentTransactionRequest {
  string orderId = 1;
  optional string customerId = 2;
  string accountId = 3;
  string brandId = 4;
  string storeId = 5;
  string systemPaymentMethodId = 6;
  string storePaymentMethodConfigId = 7;
  string credentialsConfig = 8;
  float amount = 9;
}
message GetSystemPaymentMethodByIdRequest {
  string id = 1;
}
message GetSystemPaymentMethodByIdResponse {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  PaymentMethod paymentMethod = 5;
  string logoUrl = 6;
}
message UpdatePaymentMethodForOrderRequest {
  string orderId = 1;
  string storeId = 2;
  string systemPaymentMethodId = 3;
  string credentialsConfig = 4;
  float amount = 5;
}
message UpdatePaymentMethodForOrderResponse {
  string qrLink = 1;
  string systemPaymentMethodName = 2;
}