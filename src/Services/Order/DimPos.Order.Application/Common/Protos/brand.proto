syntax="proto3";

option csharp_namespace = "DimPos.Brand.Application.Common.Protos";

service BrandGrpcService {
  rpc GetBrandIdByAccountId (GetBrandIdByAccountIdRequest) returns (GetBrandIdByAccountIdResponse);
  rpc GetBrandImageByBrandId (GetBrandImageByBrandIdRequest) returns (GetBrandImageByBrandIdResponse);
  rpc GetBrandDetailById (GetBrandDetailByIdRequest) returns (GetBrandDetailByIdResponse);
}
message GetBrandIdByAccountIdRequest {
  string accountId = 1;
}
message GetBrandIdByAccountIdResponse {
  string brandId = 1;
}
message GetBrandImageByBrandIdRequest {
  string brandId = 1;
}
message GetBrandImageByBrandIdResponse {
  string pictureUrl = 1;
}
message GetBrandDetailByIdRequest {
  string brandId = 1;
}
message GetBrandDetailByIdResponse {
  string id = 1;
  string code = 2;
  string name = 3;
  string address = 4;
  string phone = 5;
  string email = 6;
  string pictureUrl = 7;
}